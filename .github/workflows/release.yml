name: Build & Release WebOS IPK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build webOS IPK Package
        run: |
          APP_ID="com.movix.client"
          VERSION="1.0.0"
          IPK_NAME="${APP_ID}_${VERSION}_all.ipk"
          
          mkdir -p staging/control
          mkdir -p staging/data/usr/palm/applications/${APP_ID}
          
          printf "2.0\n" > staging/debian-binary
          
          cat << 'EOF' > staging/control/control
          Package: com.movix.client
          Version: 1.0.0
          Section: misc
          Priority: optional
          Architecture: all
          Maintainer: Movix Community
          Description: Movix TV streaming client for webOS
          EOF
          
          # Copy app files
          cp appinfo.json index.html app.js style.css tv-styles.css tv-adapter.js icon.png largeIcon.png movix.svg staging/data/usr/palm/applications/${APP_ID}/
          
          tar -czf staging/control.tar.gz -C staging/control control
          tar -czf staging/data.tar.gz -C staging/data usr
          (cd staging && ar -qc ../${IPK_NAME} debian-binary control.tar.gz data.tar.gz)
          
          # Calculate SHA256
          SHA256=$(sha256sum ${IPK_NAME} | awk '{print $1}')
          echo "IPK_SHA256=${SHA256}" >> $GITHUB_ENV
          echo "IPK_FILENAME=${IPK_NAME}" >> $GITHUB_ENV
          
          # Update apps.json and manifest.json with repo details
          REPO="${{ github.repository }}"
          sed -i -E "s|(raw\.githubusercontent\.com/)[^/]+/[^/]+|\1${REPO}|g" apps.json manifest.json
          sed -i -E "s|(github\.com/)[^/]+/[^/]+|\1${REPO}|g" apps.json manifest.json webosbrew.json
          sed -i "s|\"sha256\": \"[^\"]*\"|\"sha256\": \"${SHA256}\"|g" apps.json manifest.json

      - name: Commit updated repo manifests
        if: startsWith(github.ref, 'refs/heads/')
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add apps.json manifest.json
          git commit -m "chore: update repository feeds with latest IPK hash [skip ci]" || echo "No changes to commit"
          git push || echo "Push skipped"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: webos-ipk
          path: ${{ env.IPK_FILENAME }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.IPK_FILENAME }}
          name: Movix TV ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ### Movix TV pour LG webOS
            
            - **Paquet IPK** : `${{ env.IPK_FILENAME }}`
            - **SHA256** : `${{ env.IPK_SHA256 }}`
            
            #### Installation :
            1. **Via webOS Dev Manager** : Glissez-déposez le fichier `.ipk` dans l'interface de l'application.
            2. **Via Homebrew Channel** : Ajoutez la source de ce dépôt dans les paramètres de Homebrew Channel (`https://raw.githubusercontent.com/${{ github.repository }}/main/apps.json`).
